<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic CGPA Calculator & Degree Planner</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <i class="bi bi-mortarboard-fill text-warning fs-3"></i>
                <span>Academia<span class="text-warning">Advisor</span></span>
            </a>
            <span class="navbar-text text-light-50 small d-none d-md-inline">
                Academic Performance & Target Degree Planner
            </span>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light btn-sm" id="exportBtn" onclick="window.print()">
                    <i class="bi bi-printer me-1"></i> Print / Export Report
                </button>
                <button class="btn btn-danger btn-sm" id="clearDataBtn">
                    <i class="bi bi-trash me-1"></i> Reset All Data
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-4">

        <!-- Top Summary Cards Banner -->
        <div class="row g-3 mb-4">
            <!-- CGPA Card -->
            <div class="col-md-3 col-sm-6">
                <div class="card metric-card border-0 shadow-sm text-white bg-gradient-primary">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-subtitle mb-1 text-uppercase text-white-50">Cumulative CGPA</h6>
                                <h2 class="card-title fw-bold mb-0" id="cgpaValue">0.00</h2>
                            </div>
                            <i class="bi bi-award fs-1 text-white-50"></i>
                        </div>
                        <p class="card-text small mt-2 mb-0" id="degreeClassBadge">
                            <span class="badge bg-light text-dark">No Data</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Total Units Card -->
            <div class="col-md-3 col-sm-6">
                <div class="card metric-card border-0 shadow-sm text-white bg-gradient-info">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-subtitle mb-1 text-uppercase text-white-50">Total Credit Units</h6>
                                <h2 class="card-title fw-bold mb-0" id="totalUnitsValue">0</h2>
                            </div>
                            <i class="bi bi-journal-bookmark fs-1 text-white-50"></i>
                        </div>
                        <p class="card-text small mt-2 mb-0">Total Passed Credits</p>
                    </div>
                </div>
            </div>

            <!-- Total Courses Card -->
            <div class="col-md-3 col-sm-6">
                <div class="card metric-card border-0 shadow-sm text-white bg-gradient-success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-subtitle mb-1 text-uppercase text-white-50">Total Courses</h6>
                                <h2 class="card-title fw-bold mb-0" id="totalCoursesValue">0</h2>
                            </div>
                            <i class="bi bi-book fs-1 text-white-50"></i>
                        </div>
                        <p class="card-text small mt-2 mb-0">Across all semesters</p>
                    </div>
                </div>
            </div>

            <!-- Total Quality Points -->
            <div class="col-md-3 col-sm-6">
                <div class="card metric-card border-0 shadow-sm text-white bg-gradient-warning">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-subtitle mb-1 text-uppercase text-white-50">Total Points</h6>
                                <h2 class="card-title fw-bold mb-0" id="totalPointsValue">0.0</h2>
                            </div>
                            <i class="bi bi-calculator fs-1 text-white-50"></i>
                        </div>
                        <p class="card-text small mt-2 mb-0">Grade Points Sum</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            
            <!-- Form Side Panel (Add Course & Target Predictor) -->
            <div class="col-lg-4">
                
                <!-- Add Course Form Card -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-dark text-white py-3">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-plus-circle me-2 text-warning"></i>Add Course Result
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="addCourseForm">
                            <div class="mb-3">
                                <label for="semesterSelect" class="form-label small fw-semibold">Academic Semester</label>
                                <select class="form-select" id="semesterSelect" required>
                                    <option value="Y1S1">Year 1 - Semester 1</option>
                                    <option value="Y1S2">Year 1 - Semester 2</option>
                                    <option value="Y2S1">Year 2 - Semester 1</option>
                                    <option value="Y2S2">Year 2 - Semester 2</option>
                                    <option value="Y3S1">Year 3 - Semester 1</option>
                                    <option value="Y3S2">Year 3 - Semester 2</option>
                                    <option value="Y4S1">Year 4 - Semester 1</option>
                                    <option value="Y4S2">Year 4 - Semester 2</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="courseCode" class="form-label small fw-semibold">Course Code & Name</label>
                                <input type="text" class="form-control" id="courseCode" placeholder="e.g. CSC 101" required>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="creditUnits" class="form-label small fw-semibold">Credit Units</label>
                                    <input type="number" class="form-control" id="creditUnits" min="1" max="10" placeholder="e.g. 3" required>
                                </div>
                                <div class="col-6">
                                    <label for="gradeSelect" class="form-label small fw-semibold">Grade Obtained</label>
                                    <select class="form-select" id="gradeSelect" required>
                                        <option value="A">A (5.0 pts)</option>
                                        <option value="B">B (4.0 pts)</option>
                                        <option value="C">C (3.0 pts)</option>
                                        <option value="D">D (2.0 pts)</option>
                                        <option value="E">E (1.0 pts)</option>
                                        <option value="F">F (0.0 pts)</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                                <i class="bi bi-plus-lg me-1"></i> Add Course
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Target CGPA Advisor Card -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-gradient-dark text-white py-3">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-bullseye me-2 text-info"></i>Target Degree Planner
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="targetPredictorForm">
                            <div class="mb-3">
                                <label for="targetCgpaInput" class="form-label small fw-semibold">Target CGPA Goal (e.g. 4.50)</label>
                                <input type="number" class="form-control" id="targetCgpaInput" step="0.01" min="1.0" max="5.0" placeholder="4.50" required>
                            </div>

                            <div class="mb-3">
                                <label for="remainingUnitsInput" class="form-label small fw-semibold">Remaining Credit Units Left</label>
                                <input type="number" class="form-control" id="remainingUnitsInput" min="1" max="150" placeholder="e.g. 30" required>
                            </div>

                            <button type="submit" class="btn btn-outline-dark w-100 fw-semibold">
                                <i class="bi bi-calculator me-1"></i> Calculate Required GPA
                            </button>
                        </form>

                        <div id="predictionResult" class="mt-3 d-none">
                            <div class="alert mb-0" id="predictionAlert">
                                <h6 class="alert-heading fw-bold mb-1" id="predictionTitle"></h6>
                                <p class="small mb-0" id="predictionBody"></p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Dynamic Courses & Semesters Column -->
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-journal-text me-2 text-primary"></i>Academic Semesters Breakdown
                    </h4>
                    <div class="w-50">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="searchCourse" placeholder="Search course code...">
                        </div>
                    </div>
                </div>

                <div id="semestersContainer">
                    <!-- Dynamic Semester Cards will be rendered here -->
                </div>
            </div>

        </div>

    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
